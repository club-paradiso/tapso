name: Tapso
options:
  bundleIdPrefix: com.lucanomics.tapso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TapsoTransit:
    path: ../../packages/transit-core
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 89CGFQ24U5
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  Tapso:
    type: application
    platform: iOS
    sources:
      - path: TapsoApp
      - path: Shared
      - path: Resources
        buildPhase: resources
    info:
      path: TapsoApp/Info.plist
      properties:
        CFBundleDisplayName: TAPSO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.lucanomics.tapso
            CFBundleURLSchemes:
              - tapso
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: TapsoApp/Tapso.entitlements
      properties:
        # Shared with TapsoShare: the share extension leaves a parsed place here (`HandoffInbox`).
        com.apple.security.application-groups:
          - group.com.lucanomics.tapso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: TapsoTransit
      - target: TapsoLiveActivity
        embed: true
      - target: TapsoShare
        embed: true
    scheme:
      testTargets:
        - TapsoTests
      gatherCoverageData: true
  TapsoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
      - path: Resources
        buildPhase: resources
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: TAPSO Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso.LiveActivity
        PRODUCT_NAME: TapsoLiveActivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TapsoTransit
  TapsoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared/TapsoTokens.swift
      # Reads a shared screenshot on the device; the app target compiles it too.
      - path: TapsoApp/VisionScreenshotTextRecognizer.swift
      - path: Resources
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: TAPSO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: ShareExtension/TapsoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lucanomics.tapso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso.Share
        PRODUCT_NAME: TapsoShare
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TapsoTransit
  TapsoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso.Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tapso
      - package: TapsoTransit
