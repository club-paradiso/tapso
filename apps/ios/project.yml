name: Tapso
options:
  bundleIdPrefix: com.lucanomics.tapso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TapsoTransit:
    path: ../../packages/transit-core
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 89CGFQ24U5
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  Tapso:
    type: application
    platform: iOS
    sources:
      - path: TapsoApp
      - path: Shared
      - path: Resources
        buildPhase: resources
    info:
      path: TapsoApp/Info.plist
      properties:
        CFBundleDisplayName: TAPSO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.lucanomics.tapso
            CFBundleURLSchemes:
              - tapso
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: 스크린샷 원본을 사진 앱에서 지울 때만 써요. / Used only to delete a screenshot's original from Photos when you ask.
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: 승차 중 버스 위치를 보완하고 내릴 정류장을 확인하는 데, 알림을 켠 정류장에 다가갔는지 iPhone 안에서 확인하는 데, 그리고 ‘앱을 닫아도 계속 알려 주기’를 켰을 때 탑승 중 앱이 잠들지 않게 하는 데 사용합니다. 위치는 탑서 서버로 보내지 않습니다.
        NSLocationAlwaysAndWhenInUseUsageDescription: 알림을 켠 정류장에 다가가면 앱을 열지 않아도 탈 버스가 어디쯤인지 알려 드리는 데 사용합니다. 정류장 근처인지는 iPhone 안에서만 판단하고, 위치는 탑서 서버로 보내지 않습니다.
        # Only for "앱을 닫아도 계속 갱신" during a live ride without push (`RideKeepAlive`).
        UIBackgroundModes:
          - location
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: TapsoApp/Tapso.entitlements
      properties:
        # Shared with TapsoShare: the share extension leaves a parsed place here (`HandoffInbox`).
        com.apple.security.application-groups:
          - group.com.lucanomics.tapso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: TapsoTransit
      - target: TapsoLiveActivity
        embed: true
      - target: TapsoShare
        embed: true
    postBuildScripts:
      # Build identity (TAPSO_V1_RELEASE_CLOSURE.md, workstream A): the short Git
      # SHA goes into the built Info.plist as `TapsoGitCommit`, so a tester can
      # prove which commit the phone runs (`TapsoBuild.identity()`). Never fails
      # the build: outside a checkout it writes `unknown`.
      - name: Write Git commit into Info.plist
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "$PLIST" ] || exit 0
          SHA=$(cd "${SRCROOT}" && /usr/bin/git rev-parse --short=7 HEAD 2>/dev/null || echo unknown)
          if [ "$SHA" != "unknown" ] && ! (cd "${SRCROOT}" && /usr/bin/git diff --quiet 2>/dev/null); then SHA="${SHA}-dirty"; fi
          /usr/libexec/PlistBuddy -c "Delete :TapsoGitCommit" "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :TapsoGitCommit string ${SHA}" "$PLIST"
    scheme:
      testTargets:
        - TapsoTests
      gatherCoverageData: true
  TapsoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
      - path: Resources
        buildPhase: resources
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: TAPSO Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso.LiveActivity
        PRODUCT_NAME: TapsoLiveActivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TapsoTransit
  TapsoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared/TapsoTokens.swift
      # Reads a shared screenshot on the device; the app target compiles it too.
      - path: TapsoApp/VisionScreenshotTextRecognizer.swift
      - path: Resources
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: TAPSO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: ShareExtension/TapsoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lucanomics.tapso
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso.Share
        PRODUCT_NAME: TapsoShare
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TapsoTransit
  TapsoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucanomics.tapso.Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tapso
      - package: TapsoTransit
