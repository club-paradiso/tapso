<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b0e11" />
    <title>TAPSO 빠른 승차 기록</title>
    <style>
      :root { color-scheme:dark; --bg:#0b0e11; --panel:#161b21; --ink:#f4f7fa; --muted:#9fabb8; --accent:#5aa2ff; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
      main { width:min(32rem,calc(100% - 32px)); border:1px solid #34404c; border-radius:18px; background:var(--panel); padding:20px; }
      h1 { margin:0 0 8px; font-size:1.3rem; }
      p { margin:0; color:var(--muted); }
      a { color:var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>TAPSO 수집 모드 확인 중</h1>
      <p id="status">Railway가 준비되면 원탭 Acceptance Mode로 들어갑니다. 버스만 고른 뒤 시작하면 나머지는 서버가 자동으로 처리합니다.</p>
      <p id="blocked" hidden>BACKGROUND ACCEPTANCE BLOCKED · Railway collector 상태를 확인한 뒤 다시 여세요. <a href="./quick-local.html">진단용 local recorder</a>는 acceptance에 사용할 수 없습니다.</p><noscript><p>JavaScript가 꺼져 있어 background acceptance를 시작할 수 없습니다.</p></noscript>
    </main>
    <script type="module">
      import { DEFAULT_COLLECTOR_BASE, collectorHealthReady } from "./background-client-core.js";

      const background = "./acceptance.html";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 2500);
      try {
        const response = await fetch(`${DEFAULT_COLLECTOR_BASE}/health`, {
          cache: "no-store",
          mode: "cors",
          signal: controller.signal,
        });
        const payload = response.ok ? await response.json() : undefined;
        if (!collectorHealthReady(payload)) {
          document.querySelector("#status").textContent = "BACKGROUND ACCEPTANCE BLOCKED · Railway collector가 준비 상태를 증명하지 못했습니다.";
          document.querySelector("#blocked").hidden = false;
        } else {
          location.replace(background);
        }
      } catch {
        document.querySelector("#status").textContent = "BACKGROUND ACCEPTANCE BLOCKED · Railway collector /health 확인에 실패했습니다.";
        document.querySelector("#blocked").hidden = false;
      } finally {
        clearTimeout(timer);
      }
    </script>
  </body>
</html>
