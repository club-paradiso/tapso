# Matcher evidence — rider-free, bounded, automated. Replaces repeated human
# bus rides as the source of matcher-safety evidence. See
# docs/exec-plans/HUMAN_LABOR_ELIMINATION.md.
#
# Three ways it runs, none of them a person on a bus:
#   - schedule: one bounded passive collection window per day, rotating time
#     band and route pool, then the blind evaluation, the old-vs-new migration
#     and the counterfactual suite on that window;
#   - push to main that changes ops/matcher-evidence/request.json (a merged
#     request): runs that request once — by default the offline replay of the
#     Passive Shadow v3 evidence of record under the current matcher;
#   - workflow_dispatch: the same request, on demand.
#
# Scheduled workflows only run from the default branch, so nothing here runs
# before the owner merges it.
#
# Read-only provider access. No journey session, no Upstash write, no
# production configuration. This repository is public, so raw streams (raw
# vehicle numbers) must never be stored as workflow artifacts. Raw collections
# live only in the draft-release evidence vault, which GitHub exposes only to
# users with push access; workflow artifacts contain sanitized outputs only.
# Automatic matching is never enabled by anything here.
name: Matcher evidence

on:
  schedule:
    # One window a day, rotating across KST time bands and weekday/weekend.
    - cron: "37 22 * * 0"  # Mon 07:37 KST  morning peak
    - cron: "43 3 * * 2"   # Tue 12:43 KST  midday
    - cron: "11 9 * * 3"   # Wed 18:11 KST  evening peak
    - cron: "29 23 * * 3"  # Thu 08:29 KST  morning peak
    - cron: "17 5 * * 5"   # Fri 14:17 KST  afternoon
    - cron: "7 8 * * 6"    # Sat 17:07 KST  weekend evening
    - cron: "53 1 * * 0"   # Sun 10:53 KST  weekend morning
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ops/matcher-evidence/request.json"]

concurrency:
  group: matcher-evidence
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  # Belt and braces: nothing in this workflow reads it, and it must never be true.
  TRANSIT_AUTOMATIC_MATCHING_ENABLED: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      pool: ${{ steps.plan.outputs.pool }}
      requestId: ${{ steps.plan.outputs.requestId }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          node -e '
            const r = require("./ops/matcher-evidence/request.json");
            const pools = r.collect.pools.length;
            // The KST weekday: the seven schedules fall on seven different KST
            // days (07:37-18:11, far from midnight), so each pool runs once a week.
            const weekday = new Date(Date.now() + 9 * 60 * 60 * 1000).getUTCDay();
            const mode = process.env.EVENT === "schedule" ? "collect" : r.mode;
            if (!["replay", "collect"].includes(mode)) throw new Error(`unknown mode ${mode}`);
            const out = [`mode=${mode}`, `pool=${weekday % pools}`, `requestId=${r.requestId}`];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));'

  replay:
    needs: plan
    if: needs.plan.outputs.mode == 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the replay request
        id: req
        run: |
          node -e '
            const r = require("./ops/matcher-evidence/request.json").replay;
            const out = Object.entries(r).filter(([k]) => !k.startsWith("//")).map(([k, v]) => `${k}=${v}`);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));'
      - name: Fetch and verify the raw evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.req.outputs.rawArtifactId }}
          EXPECTED_DIGEST: ${{ steps.req.outputs.rawArtifactDigest }}
          RECORD_ID: ${{ steps.req.outputs.recordCollectionId }}
        run: |
          set -euo pipefail
          mkdir -p work/raw work/vault-source
          if gh release view passive-evidence-vault --json isDraft --jq .isDraft 2>/dev/null | grep -qx true \
            && gh release download passive-evidence-vault --pattern "$RECORD_ID.zip" --pattern "$RECORD_ID.zip.sha256" --dir work/vault-source 2>/dev/null; then
            (cd work/vault-source && sha256sum -c "$RECORD_ID.zip.sha256")
            unzip -q "work/vault-source/$RECORD_ID.zip" -d work/raw
            echo "raw evidence source: private draft-release vault"
          else
            echo "private vault copy unavailable; using the pinned source artifact once"
            curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -o work/raw-artifact.zip "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip"
            actual="sha256:$(sha256sum work/raw-artifact.zip | cut -d' ' -f1)"
            echo "recorded at upload: $EXPECTED_DIGEST"
            echo "downloaded now:     $actual"
            test "$actual" = "$EXPECTED_DIGEST"
            unzip -q work/raw-artifact.zip -d work/raw
            echo "raw evidence source: pinned legacy workflow artifact"
          fi
          test -d "work/raw/$RECORD_ID"
      - name: Preserve raw evidence in the private draft-release vault
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECORD_ID: ${{ steps.req.outputs.recordCollectionId }}
        run: |
          set -euo pipefail
          dir="work/raw/$RECORD_ID"
          test -d "$dir"
          (cd work/raw && zip -qr "$GITHUB_WORKSPACE/$RECORD_ID.zip" "$RECORD_ID")
          sha256sum "$RECORD_ID.zip" > "$RECORD_ID.zip.sha256"
          gh release view passive-evidence-vault >/dev/null 2>&1 || gh release create passive-evidence-vault --draft \
            --title "Passive evidence vault (private raw streams)" \
            --notes "Raw passive collections (raw vehicle numbers). Private draft, never published. Checksums alongside each asset."
          test "$(gh release view passive-evidence-vault --json isDraft --jq .isDraft)" = "true"
          existing="$(gh release view passive-evidence-vault --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing" | grep -qx "$RECORD_ID.zip"; then
            echo "$RECORD_ID.zip already exists in the vault; keeping the immutable first copy"
          else
            gh release upload passive-evidence-vault "$RECORD_ID.zip" "$RECORD_ID.zip.sha256"
          fi
      - name: Locate the collection and print every raw file's sha256
        run: |
          ls -d work/raw/pv3-* | head -1 > collection-dir.txt
          test -s collection-dir.txt
          dir="$(cat collection-dir.txt)"
          (cd "$dir" && find . -type f | sort | xargs sha256sum)
      - name: Old-vs-new migration, twice, offline (determinism check)
        run: |
          dir="$(cat collection-dir.txt)"
          for n in 1 2; do
            status=0
            node --experimental-strip-types scripts/passive-shadow/migrate.ts "$dir" \
              --out-dir=work/evidence/run-$n \
              --expect-raw-tree=${{ steps.req.outputs.expectedRawTreeSha256 }} \
              --expect-summary=${{ steps.req.outputs.expectSummary }} \
              --expect-ledger=${{ steps.req.outputs.expectLedger }} || status=$?
            if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 5 ]; then exit "$status"; fi
          done
          a="$(cat work/evidence/run-1/migration-*.json | sha256sum)"; b="$(cat work/evidence/run-2/migration-*.json | sha256sum)"
          echo "run 1: $a"; echo "run 2: $b"
          test "$a" = "$b"
          echo "deterministic=true" > work/evidence/determinism.txt
      - name: Current-policy blind evaluation, offline
        run: |
          node --experimental-strip-types scripts/passive-shadow/evaluate.ts "$(cat collection-dir.txt)" \
            --summary=work/evidence/current-policy-summary.json --sensitive-out=work/sensitive
      - name: Counterfactual suite on the real bases, offline
        run: |
          node --experimental-strip-types scripts/passive-shadow/counterfactual.ts "$(cat collection-dir.txt)" \
            --out=work/evidence/counterfactual-summary.json
      - name: Print the sanitized results
        run: |
          for f in work/evidence/run-1/migration-summary.json work/evidence/counterfactual-summary.json; do
            echo "----- $f sha256 $(sha256sum "$f" | cut -d' ' -f1)"
            node -e 'const s=require(process.argv[1]); const {rows, records, ...rest}=s; console.log(JSON.stringify(rest).slice(0, 60000))' "$(pwd)/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: matcher-evidence-sanitized-replay
          path: |
            work/evidence/run-1/migration-summary.json
            work/evidence/run-1/migration-cases.json
            work/evidence/current-policy-summary.json
            work/evidence/passive-shadow-validation-v3-wrong-commits.json
            work/evidence/counterfactual-summary.json
            work/evidence/determinism.txt
          retention-days: 90

  collect:
    needs: plan
    if: needs.plan.outputs.mode == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect one bounded window (read-only)
        env:
          TAGO_SERVICE_KEY: ${{ secrets.TAGO_SERVICE_KEY }}
          POOL: ${{ needs.plan.outputs.pool }}
        run: |
          set -u
          eval "$(node -e '
            const c = require("./ops/matcher-evidence/request.json").collect;
            const pool = c.pools[Number(process.env.POOL)];
            const q = (v) => JSON.stringify(String(v));
            console.log(`CITY=${q(c.cityCode)} PROVIDER=${q(c.provider)} ROUTES=${q(pool.routes)} NUMBERS=${q(pool.routeNumbers)}`);
            console.log(`FALLBACK_ROUTES=${q(c.pools[0].routes)} PUB_MIN=${c.publicMinutes} PUB_MAX=${c.publicMaxRoutes} DIR_MIN=${c.directMinutes} DIR_MAX=${c.directMaxRoutes}`);')"
          provider="$PROVIDER"
          if [ "$provider" = "auto" ]; then
            if [ -n "${TAGO_SERVICE_KEY:-}" ]; then provider=tago-direct; else provider=tapso-public-api; fi
          fi
          echo "pool $POOL; provider path: $provider (TAGO key present: $([ -n "${TAGO_SERVICE_KEY:-}" ] && echo yes || echo no))"
          minutes=$PUB_MIN; max=$PUB_MAX
          if [ "$provider" = "tago-direct" ]; then minutes=$DIR_MIN; max=$DIR_MAX; fi
          collect() {
            node --experimental-strip-types scripts/passive-shadow/collect.ts --yes --provider="$provider" \
              --city="$CITY" --routes="$1" --route-numbers="$2" --max-routes="$max" --minutes="$minutes" --out=work/raw
          }
          status=0
          collect "$ROUTES" "$NUMBERS" > collection-dir.txt || status=$?
          if [ "$status" -eq 4 ]; then
            echo "pool $POOL found no route with vehicles; falling back to pool 0"
            status=0
            collect "$FALLBACK_ROUTES" "" > collection-dir.txt || status=$?
          fi
          test -s collection-dir.txt
          # collect.ts prints the collection directory as an absolute path.
          node -e 'const m=require(process.argv[1]); console.log(JSON.stringify({collectionId:m.collectionId, providerPath:m.providerPath, stopReason:m.stopReason, providerCalls:m.providerCalls, failedCalls:m.failedCalls, incidents:m.incidents, preflight:m.preflight, streams:m.streams}, null, 2))' "$(cat collection-dir.txt)/manifest.json"
          exit $status
      - name: Preserve the raw window in the private draft-release vault
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dir="$(find work/raw -mindepth 1 -maxdepth 1 -type d -name 'pv3-*' | head -1 || true)"
          if [ -z "$dir" ]; then
            echo "no raw collection was created; nothing to preserve"
            exit 0
          fi
          name="$(basename "$dir")"
          (cd work/raw && zip -qr "$GITHUB_WORKSPACE/$name.zip" "$name")
          sha256sum "$name.zip" > "$name.zip.sha256"
          gh release view passive-evidence-vault >/dev/null 2>&1 || gh release create passive-evidence-vault --draft \
            --title "Passive evidence vault (private raw streams)" \
            --notes "Raw passive collections (raw vehicle numbers). Private draft, never published. Checksums alongside each asset."
          test "$(gh release view passive-evidence-vault --json isDraft --jq .isDraft)" = "true"
          existing="$(gh release view passive-evidence-vault --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing" | grep -qx "$name.zip"; then
            echo "$name.zip already exists in the vault; keeping the immutable first copy"
          else
            gh release upload passive-evidence-vault "$name.zip" "$name.zip.sha256"
          fi
      - name: Blind evaluation, migration and counterfactuals (offline)
        run: |
          dir="$(cat collection-dir.txt)"
          node --experimental-strip-types scripts/passive-shadow/evaluate.ts "$dir" \
            --summary=work/evidence/current-policy-summary.json --sensitive-out=work/sensitive
          node --experimental-strip-types scripts/passive-shadow/migrate.ts "$dir" --out-dir=work/evidence || [ $? -eq 5 ]
          node --experimental-strip-types scripts/passive-shadow/counterfactual.ts "$dir" --out=work/evidence/counterfactual-summary.json
          node -e 'const s=require(process.argv[1]); const {rows, ...rest}=s; console.log(JSON.stringify({named: rest.named, invariant: rest.invariant, blockers: rest.blockers}, null, 2))' "$(pwd)/work/evidence/migration-summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matcher-evidence-sanitized-window
          path: work/evidence/
          retention-days: 90
          if-no-files-found: ignore

  production-smoke:
    # Replaces the manual "is production still what the docs say" inspection:
    # response semantics, credential hygiene, the closed operator path and the
    # matching posture (automatic selection only with a demonstrated readiness
    # that permits it). Public endpoints only; no credential; the smoke writes
    # nothing (its session probe is rejected by input validation). A failed
    # check fails the scheduled run.
    needs: plan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke-test the production transit API
        run: |
          # Without pipefail, tee would turn a failed smoke into a green step.
          set -o pipefail
          mkdir -p work
          node --experimental-strip-types services/api/scripts/smoke.ts https://tapso-api.vercel.app | tee work/production-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke
          path: work/production-smoke.txt
          retention-days: 90
          if-no-files-found: ignore

  gate-evidence:
    # Everything the live criteria of release gate matcher-passive-safety-v4
    # read, recomputed offline from every raw collection main has produced and
    # still retains (this run's, earlier runs' artifacts, the vault): distinct
    # vehicles are counted by raw id in memory and only counts leave the job.
    # It never raises readiness: that is a reviewed change that commits these
    # files. It does fail when fresh evidence awards less than the code claims.
    # Runtime grows with the number of retained windows (each evaluated twice,
    # in two processes, for determinism, and each now also through the whole
    # counterfactual catalogue, roughly 5-12 minutes a window per pass); shard
    # it before it nears the limit.
    needs: [plan, replay, collect]
    if: always() && (needs.replay.result == 'success' || needs.collect.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      # GitHub hides draft releases from read-only tokens even in the same
      # repository. Write scope is required here only to make the private
      # draft vault visible; this job performs no writes.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch every retained raw collection from the private draft-release vault
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/collections/vault work/gate work/vault-zips
          : > work/gate/omitted-artifacts.txt
          test "$(gh release view passive-evidence-vault --json isDraft --jq .isDraft)" = "true"
          gh release download passive-evidence-vault --pattern 'pv3-*.zip' --pattern 'pv3-*.zip.sha256' --dir work/vault-zips
          found=0
          for zip in work/vault-zips/pv3-*.zip; do
            [ -f "$zip" ] || continue
            found=$((found + 1))
            (cd work/vault-zips && sha256sum -c "$(basename "$zip").sha256")
            unzip -q "$zip" -d work/collections/vault
          done
          test "$found" -gt 0
          record_id="$(node -e 'console.log(require("./ops/matcher-evidence/request.json").replay.recordCollectionId)')"
          find work/collections/vault -mindepth 1 -maxdepth 1 -type d -name "$record_id" | grep -q .
          echo "loaded $found private raw collection archive(s); evidence-of-record is present"
      - name: Assemble the live gate evidence (offline, deterministic, counts only) and evaluate the gate
        run: |
          set -eu
          record="$(node -e 'const r = require("./ops/matcher-evidence/request.json").replay; console.log([r.recordCollectionId, r.expectSummary, r.expectLedger].join(","))')"
          recordId="${record%%,*}"
          dirs="$(find work/collections -mindepth 2 -maxdepth 4 -type d -name 'pv3-*' | sort)"
          test -n "$dirs"
          # The counterfactual suite runs on every retained real base, not only
          # the evidence of record: CA-5 reads "real bases", and the 2026-09-30
          # window exposed a family the record never did (issue #61 follow-up).
          flags=""
          if printf '%s\n' $dirs | grep -q "/$recordId\$"; then flags="--record=$record"; fi
          # The failures of every window recorded before outlive its raw.
          if [ -f artifacts/matcher-directed-v1/live-replay-evidence.json ]; then flags="$flags --previous=artifacts/matcher-directed-v1/live-replay-evidence.json"; fi
          omitted="$(paste -sd, work/gate/omitted-artifacts.txt)"
          if [ -n "$omitted" ]; then flags="$flags --omitted=$omitted"; fi
          # Twice, in two processes: the outputs must be byte-identical, which
          # covers every case-level decision through each collection's digest.
          for n in 1 2; do
            node --experimental-strip-types scripts/matcher-evidence/live-evidence.ts $dirs $flags --skip-incomplete \
              --out-live=work/gate/run-$n/live-replay-evidence.json --out-counterfactual=work/gate/run-$n/counterfactual-live-evidence.json
          done
          cmp work/gate/run-1/live-replay-evidence.json work/gate/run-2/live-replay-evidence.json
          if [ -f work/gate/run-1/counterfactual-live-evidence.json ]; then
            cmp work/gate/run-1/counterfactual-live-evidence.json work/gate/run-2/counterfactual-live-evidence.json
          fi
          # Fresh evidence that no longer supports the readiness the code claims turns this run red.
          node --experimental-strip-types scripts/matcher-evidence/gate.ts --fail-below-claim \
            --live-replay=work/gate/run-1/live-replay-evidence.json --counterfactual-live=work/gate/run-1/counterfactual-live-evidence.json \
            --out=work/gate/gate-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matcher-gate-evidence
          path: work/gate/
          retention-days: 90
          if-no-files-found: ignore

