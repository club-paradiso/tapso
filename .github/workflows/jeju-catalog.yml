name: Jeju transit catalog

# Builds services/api/data/jeju-transit-catalog.json (every official Jeju route
# variant TAGO names, with ordered stops) from TAPSO's production API, plus a
# per-variant live endpoint probe and the production-readiness audit. The agent
# environment cannot reach the API, so this runs on GitHub. No secret is needed.
#
# - On a topic branch, a change to ops/jeju-catalog/request.json runs it once and
#   commits the result to that branch. With "probeOnly": true it skips the build and
#   probes the committed catalog; "firstType" probes that provider route type first
#   (순환버스 are late-night routes, 22:00-23:40 KST, shorter than a full probe).
#   "onlyRoutes": "900,910" with "passes" (1-12) and "passEverySeconds" (60-900) probes only
#   those route numbers, repeatedly, for routes TAGO gives no type and that run a few trips a day.
# - Weekly on main, it refreshes onto the branch data/jeju-catalog-refresh and
#   opens a pull request when the catalog changed. It never commits to main.
on:
  push:
    paths:
      - ops/jeju-catalog/request.json
  schedule:
    - cron: "41 18 * * 0"  # Monday 03:41 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jeju-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the branch the result goes to
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "branch=data/jeju-catalog-refresh" >> "$GITHUB_OUTPUT"
            git checkout -B data/jeju-catalog-refresh
          else
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the request
        id: request
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("ops/jeju-catalog/request.json", "utf8"));
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            // A scheduled or manual run on main always rebuilds; probeOnly applies to a request on a topic branch.
            const probeOnly = process.env.GITHUB_EVENT_NAME === "push" && r.probeOnly === true;
            const firstType = typeof r.firstType === "string" && /^[가-힣A-Za-z]{1,10}$/.test(r.firstType) ? r.firstType : "";
            // A targeted probe: route numbers only, a bounded number of passes (see build-jeju-catalog.ts).
            const onlyRoutes = probeOnly && typeof r.onlyRoutes === "string" && /^[0-9]{1,4}(,[0-9]{1,4}){0,9}$/.test(r.onlyRoutes) ? r.onlyRoutes : "";
            const passes = Number.isInteger(r.passes) && r.passes >= 1 && r.passes <= 12 ? r.passes : 1;
            const every = Number.isInteger(r.passEverySeconds) && r.passEverySeconds >= 60 && r.passEverySeconds <= 900 ? r.passEverySeconds : 300;
            out.write(`probe_only=${probeOnly}\nlive=${probeOnly || r.live === true}\nfirst_type=${firstType}\nonly_routes=${onlyRoutes}\npasses=${passes}\npass_every=${every}\n`);
          '
      - name: Build the catalog (paced, read-only)
        if: steps.request.outputs.probe_only != 'true'
        run: node --experimental-strip-types scripts/catalog/build-jeju-catalog.ts
      - name: Commit the catalog before the slower probe
        if: steps.request.outputs.probe_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/data/jeju-transit-catalog.json artifacts/route-coverage
          if git diff --cached --quiet; then echo "catalog unchanged"; exit 0; fi
          version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("services/api/data/jeju-transit-catalog.json","utf8")).catalogVersion)')
          git commit -m "data: Jeju transit catalog ${version} ($(TZ=Asia/Seoul date +%F))" -m "Workflow run ${GITHUB_RUN_ID}."
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            for attempt in 1 2 3; do
              git pull --rebase origin "${TARGET}" && git push origin "HEAD:${TARGET}" && break
              sleep $((attempt * 5))
            done
          fi
      - name: Probe every variant's live endpoint (counts only, no vehicle number)
        if: steps.request.outputs.live == 'true'
        env:
          FIRST_TYPE: ${{ steps.request.outputs.first_type }}
          ONLY_ROUTES: ${{ steps.request.outputs.only_routes }}
          PASSES: ${{ steps.request.outputs.passes }}
          PASS_EVERY: ${{ steps.request.outputs.pass_every }}
        run: |
          if [ -n "${ONLY_ROUTES}" ]; then
            node --experimental-strip-types scripts/catalog/build-jeju-catalog.ts --probe-only --only-routes "${ONLY_ROUTES}" --passes "${PASSES}" --pass-every-s "${PASS_EVERY}"
          elif [ -n "${FIRST_TYPE}" ]; then
            node --experimental-strip-types scripts/catalog/build-jeju-catalog.ts --probe-only --first-type "${FIRST_TYPE}"
          else
            node --experimental-strip-types scripts/catalog/build-jeju-catalog.ts --probe-only
          fi
      - name: Production-readiness audit (offline, from the files just written)
        run: |
          if [ -f scripts/route-coverage/production-readiness.ts ]; then
            node --experimental-strip-types scripts/route-coverage/production-readiness.ts
          fi
      - name: Commit the result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/data/jeju-transit-catalog.json artifacts/route-coverage
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("services/api/data/jeju-transit-catalog.json","utf8")).catalogVersion)')
          git commit -m "data: Jeju transit catalog ${version} ($(TZ=Asia/Seoul date +%F))" -m "Workflow run ${GITHUB_RUN_ID}."
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            git push --force origin "HEAD:${TARGET}"
            # A refresh nobody is asked to review never reaches main: from 2026-10-11 to
            # 2026-11-09 every weekly run stayed green while `gh pr create` failed with
            # "GitHub Actions is not permitted to create or approve pull requests".
            # An existing open PR is fine; any other failure turns the run red.
            if ! gh pr create --base main --head "${TARGET}" --draft \
              --title "data: refresh the Jeju transit catalog (${version})" \
              --body "Weekly catalog refresh from workflow run ${GITHUB_RUN_ID}. Review artifacts/route-coverage/jeju-production-readiness.md for added, removed and changed variants before merging."; then
              open=$(gh pr list --head "${TARGET}" --base main --state open --json number --jq length || echo 0)
              if [ "${open}" -gt 0 ]; then
                echo "a pull request for ${TARGET} is already open; the refresh is on it"
              else
                echo "::error title=Catalog refresh not proposed::The refreshed catalog is on ${TARGET}, but no pull request could be opened. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open one from ${TARGET} by hand."
                echo "The refreshed catalog (${version}) is on \`${TARGET}\` but no pull request could be opened." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
          else
            for attempt in 1 2 3; do
              git pull --rebase origin "${TARGET}" && git push origin "HEAD:${TARGET}" && exit 0
              sleep $((attempt * 5))
            done
            exit 1
          fi
