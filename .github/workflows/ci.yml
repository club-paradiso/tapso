name: CI

on:
  push:
  pull_request:

jobs:
  main-history-policy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require main updates to come from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          merged_count="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')"
          if [ "${merged_count}" -lt 1 ]; then
            echo "::error::main must be updated through a merged pull request. Direct pushes are policy violations."
            exit 1
          fi

  transit-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path packages/transit-core

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix services/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:vercel
      - run: npm run build
      - name: Validate Figma Code Connect templates
        run: npx --yes --package=@figma/code-connect@2.0.0 figma connect parse --config figma.config.json --dry-run
