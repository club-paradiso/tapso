# Counterfactual failure traces on real bases (temporary investigation workflow).
#
# Run 36823397781 showed that the current matcher, under the follower_overtaking
# family as issue #61 defined it (before #63 narrowed it), still commits wrong on
# every retained real base, and that late_appearance_s_minus_2 fails on the
# 2026-09-30 window under the current code. This prints decision-by-decision
# traces of those cases, with vehicles named by role only, so the mechanism can
# be read before the matcher is changed. Read-only, offline after the vault fetch.
name: F21 ablation

on:
  push:
    branches: [claude/fervent-babbage-driy3p]
    paths: [".github/workflows/f21-ablation.yml"]

permissions:
  contents: write
  actions: read

env:
  TRANSIT_AUTOMATIC_MATCHING_ENABLED: "false"

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: original-family, collection: pv3-20260925T052712Z-f096de91, counterfactual: follower_overtaking }
          - { variant: original-family, collection: pv3-20260930T071906Z-c8b858fc, counterfactual: follower_overtaking }
          - { variant: current, collection: pv3-20260930T071906Z-c8b858fc, counterfactual: late_appearance_s_minus_2 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix services/api --omit=optional --no-audit --no-fund
      - name: Apply the variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          git diff 0a68c2f^ 0a68c2f -- services/api/src/passiveCounterfactual.ts > /tmp/f63.patch
          case "$VARIANT" in
            current) ;;
            original-family) git apply -R /tmp/f63.patch ;;
            *) echo "unknown variant $VARIANT"; exit 2 ;;
          esac
          git diff --stat
      - name: Fetch the collection from the private vault
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COLLECTION: ${{ matrix.collection }}
        run: |
          set -euo pipefail
          mkdir -p work/vault work/raw
          test "$(gh release view passive-evidence-vault --json isDraft --jq .isDraft)" = "true"
          gh release download passive-evidence-vault --pattern "$COLLECTION.zip" --pattern "$COLLECTION.zip.sha256" --dir work/vault
          (cd work/vault && sha256sum -c "$COLLECTION.zip.sha256")
          unzip -q "work/vault/$COLLECTION.zip" -d work/raw
      - name: Trace the failing cases (roles only, no vehicle numbers)
        env:
          COLLECTION: ${{ matrix.collection }}
          CF: ${{ matrix.counterfactual }}
        run: |
          node --experimental-strip-types scripts/matcher-evidence/trace-counterfactual.ts "work/raw/$COLLECTION" \
            --counterfactual="$CF" --limit=6 --window-s=600 > trace.json
          node -e '
            const t = require(process.argv[1]);
            console.log(`TRACE ${t.counterfactual}: ${t.failing} failing of ${t.applicable} applicable; ${t.traced} traced`);
            for (const c of t.traces) console.log("CASE " + JSON.stringify(c));
          ' "$(pwd)/trace.json"
