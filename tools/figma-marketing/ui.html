<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:14px/1.6 system-ui;padding:18px;color:#071923}button,a{padding:12px 20px;background:#2fc7aa;border:0;border-radius:12px;color:#071923;cursor:pointer}p{margin:14px 0}#download{display:none}</style><h2>탑서 웹사이트 설정 내보내기</h2><p>Variables의 <b>TAPSO Web PR</b>에서 문구와 Light / Dark 색을 수정한 뒤 내보내세요.</p><button id="export">JSON 내보내기</button><a id="download" download="marketing.json">파일 저장</a><p id="status">내보내기만으로 라이브 사이트가 변경되지는 않아요.</p><script>
let url;document.querySelector('#export').onclick=()=>parent.postMessage({pluginMessage:{type:'export'}},'*');window.onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;const status=document.querySelector('#status');if(m.type==='error'){status.textContent=m.message;return;}if(m.type!=='settings')return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([m.json],{type:'application/json'}));const a=document.querySelector('#download');a.href=url;a.style.display='inline-block';status.textContent='저장 후 저장소에서 design:import 명령으로 반영하고 PR을 만드세요.';};
</script></html>
